                scientificName: "Botanical Reference Signage",

                characteristic: "On-site signage documenting botanical sections (Eranthemum, Aralia, Acalypha, Pleomele) and potting amendments (Ready Pot Mix, Coco Peat, Vermicompost, Cow & Sheep Manure, Neem Cake).",

        const currentIndices = {};
        plantSpecies.forEach(plant => { currentIndices[plant.id] = 0; });

        const plantGrid = document.getElementById('plantGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        function renderCatalog(filterText = '') {
            plantGrid.innerHTML = '';

            const filtered = plantSpecies.filter(plant => 
                plant.commonName.toLowerCase().includes(filterText.toLowerCase()) ||
                plant.scientificName.toLowerCase().includes(filterText.toLowerCase()) ||
                plant.category.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(plant => {
                const activeIdx = currentIndices[plant.id] || 0;
                const currentPhoto = plant.photos[activeIdx];
                const hasMultiple = plant.photos.length > 1;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition-shadow flex flex-col justify-between';
                
                let carouselControlsHTML = '';
                if (hasMultiple) {
                    carouselControlsHTML = `
                        <button onclick="changeSlide('${plant.id}', -1)" class="absolute left-2.5 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-xs transition-colors focus:outline-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button onclick="changeSlide('${plant.id}', 1)" class="absolute right-2.5 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-xs transition-colors focus:outline-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 bg-black/40 px-2.5 py-1 rounded-full backdrop-blur-xs">
                            ${plant.photos.map((_, i) => `
                                <span class="w-2 h-2 rounded-full transition-colors ${i === activeIdx ? 'bg-white' : 'bg-white/50'}"></span>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <!-- Image Carousel Container -->
                        <div class="h-64 w-full overflow-hidden bg-slate-100 relative group">
                            <img id="img-${plant.id}" src="${currentPhoto.url}" alt="${plant.commonName}" class="w-full h-full object-cover transition-transform duration-500" onerror="this.src='https://placehold.co/800x600/e2e8f0/64748b?text=Local+Image+Missing'">
                            
                            <!-- Category Badge -->
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm text-xs font-semibold text-emerald-800 px-3 py-1 rounded-full shadow-xs">
                                ${plant.category}
                            </span>

                            <!-- Photo Capture Date & Caption Tag -->
                            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent pt-6 pb-3 px-4 text-white flex justify-between items-end">
                                <div>
                                    <p id="caption-${plant.id}" class="text-xs font-medium text-slate-200">${currentPhoto.caption}</p>
                                    <p id="date-${plant.id}" class="text-[11px] text-emerald-300 font-medium mt-0.5 flex items-center gap-1">
                                        📅 Taken: ${currentPhoto.date}
                                    </p>
                                </div>
                                ${hasMultiple ? `<span class="text-[11px] bg-white/20 px-2 py-0.5 rounded-full font-mono">${activeIdx + 1}/${plant.photos.length}</span>` : ''}
                            </div>

                            ${carouselControlsHTML}
                        </div>

                        <!-- Card Details -->
                        <div class="p-6">
                            <h2 class="text-xl font-bold text-slate-900">${plant.commonName}</h2>
                            <p class="text-xs font-medium text-emerald-700 italic mt-0.5">${plant.scientificName}</p>
                            <p class="text-slate-600 text-sm mt-3 leading-relaxed">${plant.characteristic}</p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 pt-0">
                        <div class="w-full bg-slate-50 border border-slate-100 rounded-xl py-2 px-3 text-center text-xs text-slate-500 font-medium">
                            📁 File: <code class="text-emerald-700 font-mono">${currentPhoto.url.split('/').pop()}</code>
                        </div>
                    </div>
                `;
                plantGrid.appendChild(card);
            });
        }

        // Slide controller
        window.changeSlide = function(plantId, direction) {
            const plant = plantSpecies.find(p => p.id === plantId);
            if (!plant) return;

            let newIdx = currentIndices[plantId] + direction;
            if (newIdx >= plant.photos.length) {
                newIdx = 0;
            } else if (newIdx < 0) {
                newIdx = plant.photos.length - 1;
            }

            currentIndices[plantId] = newIdx;
            renderCatalog(searchInput.value);
        };

        // Initial render
        renderCatalog();

        // Search listener
        searchInput.addEventListener('input', (e) => {
            renderCatalog(e.target.value);
        });
    </script>
</body>
</html>
