<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plants</title>
  
  <!-- Typography: Google Fonts Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Accompanying Stylesheet (Separation of Concerns) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Subtle Floating Top-Right Search (No Name Header on the Page) -->
  <aside class="top-search-bar" role="search" aria-label="Search Plant Specimens">
    <div class="search-box-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input 
        type="search" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search..." 
        aria-label="Search by plant name, foliage color, or weather"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search input">&times;</button>
    </div>
  </aside>

  <!-- Main Viewport: Two Side-By-Side Screens on Desktop, Single Swipe-Up Snap on Mobile -->
  <main class="catalog-viewport" id="catalogViewport">
    <div id="phonesGrid" class="phones-grid">
      <!-- Dynamic Phone Screens injected by js/app.js -->
    </div>

    <!-- Empty Search State -->
    <div id="noResultsView" class="no-results-view" style="display: none;">
      <h2>No Specimens Found</h2>
      <p>Try searching for a different plant name, foliage color (e.g. pink, red, silver), sunlight, or "warm weather".</p>
    </div>
  </main>

  <!-- Modular Scripts (Data Model & App Logic) -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
